name: Isolated diagnostics tests
on:
  push:
    branches: [main, wip/tool-error-diagnostics]
  pull_request:
    branches: [main, wip/tool-error-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report tested commit and runtime
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 5)) { console.error('Node >=22.5 is required'); process.exit(1); }"
      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"
      - name: Run full npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
      - name: Preserve logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-test-logs
          path: |
            ${{ runner.temp }}/npm-ci.log
            ${{ runner.temp }}/npm-test.log
          if-no-files-found: warn
          retention-days: 7
